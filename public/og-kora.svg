<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">KORA, la plateforme des talents africains</title>
  <desc id="desc">Découvrez des talents africains et collaborez avec leurs managers sur KORA.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5df9a"/>
      <stop offset=".48" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#a97b1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="24%" r="58%">
      <stop offset="0" stop-color="#d4af37" stop-opacity=".22"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0d1728"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="1020" cy="520" r="260" fill="#203b60" opacity=".42"/>
  <circle cx="1020" cy="520" r="180" fill="none" stroke="#d4af37" stroke-opacity=".28" stroke-width="2"/>
  <circle cx="1020" cy="520" r="130" fill="none" stroke="#d4af37" stroke-opacity=".18" stroke-width="2"/>
  <rect x="84" y="82" width="68" height="7" rx="3.5" fill="url(#gold)"/>
  <text x="84" y="250" fill="#ffffff" font-family="Manrope, Arial, sans-serif" font-size="124" font-weight="800" letter-spacing="-8">KORA</text>
  <text x="90" y="315" fill="#f0d27c" font-family="Manrope, Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="6">LA PLATEFORME DES TALENTS AFRICAINS</text>
  <text x="90" y="405" fill="#ffffff" font-family="Manrope, Arial, sans-serif" font-size="38" font-weight="600">Découvrez des talents.</text>
  <text x="90" y="458" fill="#ffffff" font-family="Manrope, Arial, sans-serif" font-size="38" font-weight="600">Collaborez avec leurs managers.</text>
  <rect x="90" y="520" width="245" height="5" rx="2.5" fill="url(#gold)"/>
  <text x="90" y="565" fill="#c5cfdd" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="1">AFRIQUE · CRÉATIVITÉ · OPPORTUNITÉS</text>
</svg>